# WebSearch MCP 配置示例
#
# 复制为 config.yaml 后填入密钥，或改用环境变量注入（推荐）。
# 密钥解析顺序：环境变量 api_key_env > 配置文件 api_key。

server:
  # 相对于本配置文件所在目录解析
  db_path: ./data/websearch.db
  request_timeout: 20s
  # debug | info | warn | error
  log_level: info

providers:
  exa:
    enabled: true
    api_key_env: EXA_API_KEY
    api_key: ""
    # 硬上限（请求数）。Exa 用 type=lite 时 $10 免费额度约可支撑 2500 次。
    monthly_limit: 1000
    # 免费额度上限（美元），与请求数上限同时生效取最严。
    monthly_limit_usd: 10.0
    # 每月 1 号归零，余额不累积。
    period_model: calendar_month

  brave:
    enabled: true
    api_key_env: BRAVE_API_KEY
    api_key: ""
    # Brave 服务端月度请求数不限量（x-ratelimit-limit 第二值为 0），
    # 实际约束是 $5 预付信用（≈1000 次），本地闸门是唯一防线。
    monthly_limit: 1000
    period_model: rolling_31d

  tavily:
    enabled: true
    api_key_env: TAVILY_API_KEY
    api_key: ""
    monthly_limit: 1000
    # 按账号开通日的账单周期滚动，官方未公开开通日，用首次使用日近似。
    period_model: rolling_1m

routing:
  # round_robin
  strategy: round_robin
  # 单次搜索最多尝试的平台数
  max_attempts: 3
  # 免密钥通道：Exa / Brave / Tavily 全部不可用时依次尝试。
  # 不消耗任何付费额度。
  fallback:
    # 默认开启；设为 false 可完全关闭兜底。
    enabled: true
    # 通道限流或反爬后的冷却时长。
    cooldown: 10m
    # 搜索顺序：Parallel（质量最好）→ TinyFish（快且稳定）。
    search: [parallel, tinyfish]
    # 抓取顺序：TinyFish（JS 渲染）→ Jina Reader → 本地抓取。
    fetch: [tinyfish, jina, local]
    # TinyFish 需要密钥。环境变量优先，留空时回落到 tinyfish_api_key。
    tinyfish_api_key_env: TINYFISH_API_KEY
    tinyfish_api_key: ""
